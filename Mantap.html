<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 30px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(255, 105, 180, 0.3);
    animation: muncul 1s ease;
  }

  @keyframes muncul {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    color: #e91e63;
    font-size: 28px;
    margin-bottom: 15px;
  }

  .pesan {
    color: #555;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  video {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    margin-bottom: 20px;
  }

  .tombol {
    background: linear-gradient(135deg, #ff6b9d, #e91e63);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
  }

  .tombol:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 25px rgba(233, 30, 99, 0.6);
  }

  .hati {
    position: fixed;
    font-size: 24px;
    animation: naik 5s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes naik {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  .pesan-rahasia {
    margin-top: 20px;
    font-size: 18px;
    color: #e91e63;
    font-weight: bold;
    display: none;
    animation: muncul 0.8s ease;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Hai Sayang ❤️</h1>
    <p class="pesan">Aku bikin ini khusus buat kamu. Semoga kamu suka ya 🥰</p>

    <!-- 🎬 GANTI VIDEO DI BAWAH INI -->
    <!-- Cara ganti: ubah src="video-romantis.mp4" jadi nama file video kamu -->
    <!-- Pastikan file video ada di folder yang sama dengan file HTML ini -->
    <video controls poster="thumbnail.jpg">
      <source src="mygirl.mp4" type="video/mp4">
      Browser kamu tidak mendukung video.
    </video>

    <button class="tombol" onclick="tampilkanPesan()">Klik Aku 💌</button>

    <p class="pesan-rahasia" id="pesanRahasia">
      Aku sayang kamu, hari ini, besok, dan selamanya 💖
    </p>
  </div>

<script>
  // Fungsi tombol
  function tampilkanPesan() {
    const pesan = document.getElementById('pesanRahasia');
    pesan.style.display = 'block';
  }

  // Hati beterbangan
  function buatHati() {
    const hati = document.createElement('div');
    hati.className = 'hati';
    hati.innerHTML = ['❤️','💕','💖','💗','💓'][Math.floor(Math.random()*5)];
    hati.style.left = Math.random() * 100 + 'vw';
    hati.style.animationDuration = (Math.random() * 3 + 3) + 's';
    hati.style.fontSize = (Math.random() * 20 + 15) + 'px';
    document.body.appendChild(hati);
    setTimeout(() => hati.remove(), 6000);
  }

  setInterval(buatHati, 400);
</script>

</body>
</html>
